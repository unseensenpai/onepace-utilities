name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/content/content.js && node --check src/content/player-frame.js && node --check src/background/service-worker.js && node --check src/content/animpow.js && node --check src/shared/animpow-core.js && node --check src/content/animpow-socket-guard.js && node --check src/content/tranime.js && node --check src/shared/tranime-core.js && node --check src/shared/one-piece-titles.js && node --check src/content/jwplayer-bridge.js
      - run: zip -r onepace-utilities.zip manifest.json src assets README.md LICENSE -x '*/.DS_Store'
      - uses: softprops/action-gh-release@v2
        with:
          files: onepace-utilities.zip
